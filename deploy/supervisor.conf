[program:zaza-worker]
command=/usr/bin/php /var/www/zaza/current/artisan queue:work database --sleep=3 --tries=3 --timeout=60
directory=/var/www/zaza/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/log/supervisor/zaza-worker.log
