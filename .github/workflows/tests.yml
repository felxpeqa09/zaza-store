name: Pruebas de Laravel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zaza_test
          POSTGRES_USER: zaza_test
          POSTGRES_PASSWORD: zaza_ci_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U zaza_test -d zaza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ job.services.postgres.ports[5432] }}
      DB_DATABASE: zaza_test
      DB_USERNAME: zaza_test
      DB_PASSWORD: zaza_ci_only
      DB_URL: ''
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, mbstring, pdo_pgsql, pdo_sqlite, xml, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Preparar Laravel
        run: |
          php -r 'echo "APP_KEY=base64:", base64_encode(random_bytes(32)), PHP_EOL;' >> "$GITHUB_ENV"
          composer install --no-interaction --prefer-dist

      - name: Compilar recursos
        run: |
          npm ci
          npm run build

      - name: Ejecutar PHPUnit con PostgreSQL
        run: vendor/bin/phpunit --do-not-cache-result --fail-on-skipped
